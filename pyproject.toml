[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "derma"
version = "0.1.0"
description = "Transfer learning, class imbalance, Grad-CAM and calibration on DermaMNIST"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
