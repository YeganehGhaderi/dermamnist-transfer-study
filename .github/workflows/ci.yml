name: tests

on:
  push:
  pull_request:

# a new push cancels the older runs of the same branch that are still waiting or running
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU-only PyTorch (much smaller than the CUDA build)
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install the package and the other dependencies
        run: |
          pip install numpy scikit-learn pandas matplotlib pyyaml pytest pillow
          pip install -e .
      - name: Run tests
        run: pytest -q
